# Kontroll för varje PR mot main och varje push till main: samma steg som lokalt före driftsättning.
# Inga hemligheter behövs: kärnproven använder minnesersättare för Blob, modell och DNS, och bygget läser inga nycklar.
# Webbläsarproven och de verkliga modellproven körs mot skyddad förhandsvisning utanför CI (se README).
name: ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  kontroll:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Låsfil, sju dagars karenstid och paketändringar
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE_SHA"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then base=$(git rev-parse HEAD^); fi
          node scripts/lasfil.mjs --bas "$base" | tee paketandringar.json
          cat paketandringar.json >> "$GITHUB_STEP_SUMMARY"
      - run: npm ci
      - run: npm run test:leveranskedja
      - run: npm run kontroll:audit
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:core
      - run: npm run build
